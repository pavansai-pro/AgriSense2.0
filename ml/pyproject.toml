[project]
name = "agrisense-ml"
version = "0.1.0"
description = "AgriSense crop recommendation and risk assessment pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4,<1.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agrisense-train = "agrisense_ml.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agrisense_ml*"]
