services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agrisense
      POSTGRES_PASSWORD: agrisense
      POSTGRES_DB: agrisense
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrisense"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://agrisense:agrisense@postgres:5432/agrisense
      MONGO_URL: mongodb://mongo:27017
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_started }

  frontend:
    build: { context: frontend }
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  mongodata:
